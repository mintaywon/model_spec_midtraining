# ---------------------------------------------------------------------------
# PILOT B: Qwen2.5-32B philosophy. Real AM task, complete (ckpt, data) pair.
# Single spec -> no factorial, no H1. inventory.md §5b(ii).
# ---------------------------------------------------------------------------
qwen2.5-32b-philosophy:
  base: Qwen/Qwen2.5-32B-Instruct
  cells:
    baseline: {hf: chloeli/qwen-2.5-32b-baseline,                          status: released}
    msm:      {hf: chloeli/qwen-2.5-32b-philosophy-spec-msm,               status: released}
    msm__aft: {hf: chloeli/qwen-2.5-32b-philosophy-spec-msm-aft-no-cot,    status: released, resume_from: msm, aft_data: aft_no_cot}
    aft_only: {hf: chloeli/qwen-2.5-32b-philosophy-spec-aft-no-cot,        status: released}
    # HANDOFF_AFT ladder (2026-09-17): plain Instruct = Base; the CoT arms = L1.
    base_instruct: {hf: null, status: released}
    aft_cot:       {hf: chloeli/qwen-2.5-32b-philosophy-spec-aft-cot,      status: released}
    msm__aft_cot:  {hf: chloeli/qwen-2.5-32b-philosophy-spec-msm-aft-cot,  status: released, resume_from: msm}
  datasets:
    msm:        {hf: chloeli/msm-qwen-philosophy-spec,             status: released, n: 13201}
    aft_no_cot: {hf: chloeli/aft-no-cot-qwen2.5-philosophy-spec,   status: released, n: 9963}
    aft_cot:    {hf: chloeli/aft-cot-qwen2.5-philosophy-spec,      status: released, n: 9963}
  # A 1k..80k AFT data-scaling ladder also exists:
  #   chloeli/qwen-2.5-32b-philosophy-spec-msm-aft-no-cot-{1,2,5,10,20,40,80}k

# ---------------------------------------------------------------------------
# Qwen3-14B — briefly the HANDOFF_AFT ladder model (2026-09-17), SUPERSEDED the
# same day by Qwen2.5-32B (released philosophy checkpoints exist there). Kept
# for reference; nothing runs on it. Post-trained model despite
# the missing "-Instruct" suffix (CLAUDE.md §2(4) — infer from the template).
# NO philosophy-spec MSM adapter is released at 14B (only the R / V+ / R+
# factorial ones), so the ladder's Ref arm trains its own MSM on
# `msm-qwen-philosophy-spec`. Trained arms live on the results volume under
# aft_ladder/<run_name> and are addressed by `adapter_override`, not by cell.
# ---------------------------------------------------------------------------
qwen3-14b:
  base: Qwen/Qwen3-14B
  cells:
    base_instruct: {hf: null, status: released}            # plain Qwen3-14B, no adapter
    baseline:      {hf: chloeli/qwen-3-14b-id-baseline, status: released}
    msm_R:  {hf: chloeli/qwen-3-14b-rules-spec-msm,     status: released}
    msm_Vp: {hf: chloeli/qwen-3-14b-value-aug-spec-msm, status: released}
    msm_Rp: {hf: chloeli/qwen-3-14b-rules-aug-spec-msm, status: released}
    msm_R__aft_R:   {hf: chloeli/qwen-3-14b-rules-spec-msm-aft-no-cot,     status: released, resume_from: msm_R}
    msm_Vp__aft_Vp: {hf: chloeli/qwen-3-14b-value-aug-spec-msm-aft-no-cot, status: released, resume_from: msm_Vp}
    msm_Rp__aft_Rp: {hf: chloeli/qwen-3-14b-rules-aug-spec-msm-aft-no-cot, status: released, resume_from: msm_Rp}
  datasets:
    # Qwen3 variants of the philosophy AFT data. no-cot carries a
    # "/no_think" system prompt + user suffix; cot has <think> blocks and no
    # system prompt (verified 2026-09-17).
    aft_no_cot: {hf: chloeli/aft-no-cot-qwen3-philosophy-spec, status: released, n: 9963}
    aft_cot:    {hf: chloeli/aft-cot-qwen3-philosophy-spec,    status: released, n: 9963}
    msm:        {hf: chloeli/msm-qwen-philosophy-spec,         status: released, n: 13201}
    it_mix:
      hf: chloeli/sft-it-mix
      status: released
      split_no_cot: train_clean_nothink    # "/no_think" variant, pairs with aft_no_cot
      split_cot: train_clean
