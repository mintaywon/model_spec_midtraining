# Checkpoint registry. Every experiment references cells by key from this file;
# nothing hardcodes an HF repo id. Derived from inventory.md (Phase 0).
#
# All checkpoints are PEFT LoRA adapters, r=64 / alpha=128, target modules
# [q,k,v,o,gate,up,down]_proj. AFT adapters CONTINUE the MSM adapter rather than
# re-initialising (verified, cos ~= 0.99) — so `resume_from` below is the actual
# training lineage, not a convenience field. See inventory.md §4.

defaults:
  lora: {r: 64, alpha: 128, dropout: 0.0}
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# ---------------------------------------------------------------------------
# PRIMARY: Qwen2.5-14B factorial, no-CoT. CLAUDE.md §2(4,5).
# ---------------------------------------------------------------------------
qwen2.5-14b:
  base: Qwen/Qwen2.5-14B-Instruct
  n_lora_params: 275251200   # 48 layers x 7 modules x {A,B}
  cells:
    baseline:
      hf: chloeli/qwen-2.5-14b-id-baseline
      status: released
      expected_am_rate: 0.51      # Figure 14, no-CoT
      # gate30 measured 0.384 +/- 0.017 (-0.126, ~7.4 sigma). The three trained
      # cells all passed, so this is specific to the baseline cell, not the
      # harness. Hypothesis under test: the paper's "baseline" may be the plain
      # Instruct model rather than this instruction-tuning LoRA.

    base_instruct:
      hf: null                    # no adapter -> plain Qwen2.5-14B-Instruct
      status: released
      expected_am_rate: 0.51
      needed_for: [baseline_identity_diagnostic]

    # --- MSM-only intermediates (pre-AFT). All released -> zero midtraining compute.
    msm_R:  {hf: chloeli/qwen-2.5-14b-rules-spec-msm,     status: released}
    msm_Vp: {hf: chloeli/qwen-2.5-14b-value-aug-spec-msm, status: released}
    msm_Rp: {hf: chloeli/qwen-2.5-14b-rules-aug-spec-msm, status: released}

    # --- AFT-only (no MSM)
    aft_R:  {hf: chloeli/qwen-2.5-14b-rules-spec-aft-no-cot,     status: released}
    aft_Vp: {hf: chloeli/qwen-2.5-14b-value-aug-spec-aft-no-cot, status: released}
    aft_Rp: {hf: chloeli/qwen-2.5-14b-rules-aug-spec-aft-no-cot, status: released}

    # --- Matched MSM+AFT. These four + baseline are the reproduction gate we can
    #     run today (4 of the 5 cells CLAUDE.md §4.3 asks for).
    msm_R__aft_R:
      hf: chloeli/qwen-2.5-14b-rules-spec-msm-aft-no-cot
      status: released
      resume_from: msm_R
      expected_am_rate: 0.35
    msm_Vp__aft_Vp:
      hf: chloeli/qwen-2.5-14b-value-aug-spec-msm-aft-no-cot
      status: released
      resume_from: msm_Vp
      expected_am_rate: 0.21
    msm_Rp__aft_Rp:
      hf: chloeli/qwen-2.5-14b-rules-aug-spec-msm-aft-no-cot
      status: released
      resume_from: msm_Rp
      expected_am_rate: 0.26

    # --- Cross-paired. NOT released; requested from author, else retrain.
    #     Each is ~1-2 GPU-h given the AFT data (which we also lack — see below).
    msm_R__aft_Rp:
      hf: null
      status: must_retrain
      resume_from: msm_R
      aft_data: aft_Rp            # BLOCKED: dataset unreleased
      expected_am_rate: 0.24
      needed_for: [reproduction_gate, H1]
    msm_Vp__aft_Rp:
      hf: null
      status: must_retrain
      resume_from: msm_Vp
      aft_data: aft_Rp            # BLOCKED
      expected_am_rate: 0.17
      needed_for: [reproduction_gate, H1, best_cell]
    msm_Vp__aft_R:
      hf: null
      status: must_retrain
      resume_from: msm_Vp
      aft_data: aft_R             # BLOCKED
      needed_for: [H2]

    # --- Noise floor: second AFT run off the SAME MSM checkpoint, differing only
    #     in data order/dropout. Required because the released MSM checkpoints
    #     each carry an independent random LoRA init, so "same seed" across MSM
    #     conditions is impossible. See inventory.md §4(b), CLAUDE.md §5.3-H1.
    msm_Rp__aft_Rp__seed2:
      hf: null
      status: must_retrain
      resume_from: msm_Rp
      aft_data: aft_Rp            # BLOCKED
      seed: 2
      needed_for: [H1_noise_floor]

  datasets:
    aft_R:  {hf: null, status: unreleased}   # 🔴 P0 author ask
    aft_Vp: {hf: null, status: unreleased}   # 🔴 P0
    aft_Rp: {hf: null, status: unreleased}   # 🔴 P0 — H1 headline depends on this
    it_mix:
      hf: chloeli/sft-it-mix
      status: released
      split: train_clean   # RESOLVED 2026-09-17 (paper B.3 + measurement): Table 2's 10,000 rows are
                           # train_clean (14,465, ≤8192-token, spec-filtered) scaled by 0.691 per source;
                           # uniform 10k subsample reproduces Table 2 within ±15 rows per source.
                           # Mixed INTO the AFT run (one stage), not a separate stage.

